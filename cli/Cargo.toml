[package]
name = "intend"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Intendancy consumer CLI: verified registry snapshots (update), exact skill installation (install), and lockfile auditing (audit) per the partially frozen verified-snapshot spec v0.2. Pre-1.0: header-quorum anchoring only (strict light-client mode pending integration); JSON debug transport; bounded UnixFS-basic install profile."

# Deliberately its own workspace (mirrors the gate spikes).
[workspace]

[dependencies]
alloy = { version = "1.0.37", features = [
    "providers",
    "provider-http",
    "rpc-types",
    "consensus",
    "contract",
    "sol-types",
    "network",
    "rlp",
    "json-rpc",
] }
alloy-trie = { version = "0.9.5", features = ["ethereum"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
eyre = "0.6"
thiserror = "2"
flate2 = "1"
data-encoding = "2"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["blocking"] }
unicode-normalization = "0.1"
url = "2"
libc = "0.2"
tower = "0.5"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
