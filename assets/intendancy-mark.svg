<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Intendancy</title>
  <desc id="desc">A sky-blue I within a graphite administrative arch, crossed by gold registry rows with green verified-status nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a68a5b"/>
      <stop offset="100%" stop-color="#f9e2af"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#585b70"/>
      <stop offset="100%" stop-color="#313244"/>
    </linearGradient>
  </defs>

  <!-- Shared family plate and proscenium: the governed house. -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="12.5" fill="none" stroke="#313244"/>
  <path d="M12 53V25Q12 11 26 11h12q14 0 14 14v28" fill="none" stroke="url(#arch)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="11" r="2" fill="#45475a"/>
  <circle cx="32" cy="11" r="0.9" fill="#585b70"/>

  <!-- Registry ledger rows, replacing Intendant's conductor baton. -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.4" stroke-linecap="round">
    <path d="M17 25h10M37 25h7"/>
    <path d="M17 33h10M37 33h7"/>
    <path d="M17 41h10M37 41h7"/>
  </g>
  <g fill="#a6e3a1">
    <circle cx="47" cy="25" r="1.8" opacity="0.9"/>
    <circle cx="47" cy="33" r="1.8" opacity="0.75"/>
    <circle cx="47" cy="41" r="1.8" opacity="0.6"/>
  </g>

  <!-- The family I: administrator and administrative domain. -->
  <g fill="url(#accent)">
    <rect x="25" y="17" width="14" height="3" rx="1"/>
    <rect x="30" y="17" width="4" height="31" rx="1"/>
    <rect x="25" y="45" width="14" height="3" rx="1"/>
  </g>
</svg>
