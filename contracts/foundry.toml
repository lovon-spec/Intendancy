[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
auto_detect_solc = true
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.fuzz]
runs = 256

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[rpc_endpoints]
gnosis = "${GNOSIS_RPC_URL}"
