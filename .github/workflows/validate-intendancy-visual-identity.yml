name: Validate Intendancy visual identity

on:
  push:
    branches:
      - chore/align-intendancy-visual-identity

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify brand invariants and SVG syntax
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-brand.sh
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          for name in (
              "assets/intendancy-mark.svg",
              "frontend/public/favicon.svg",
              "meta-evidence/intendancy-logo.svg",
          ):
              root = ElementTree.parse(Path(name)).getroot()
              if root.tag != "{http://www.w3.org/2000/svg}svg":
                  raise SystemExit(f"not an SVG root: {name}")
          PY

      - name: Validate branded frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run lint
          npm run build

      - name: Remove migration workflow and commit validated tree
        shell: bash
        run: |
          set -euo pipefail
          rm -- .github/workflows/validate-intendancy-visual-identity.yml
          ./scripts/check-brand.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'brand: align Intendancy with the Intendant family'
          git push origin HEAD:chore/align-intendancy-visual-identity
