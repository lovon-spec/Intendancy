name: One-time Intendancy rebrand

on:
  push:
    branches:
      - chore/rebrand-intendancy

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Rebrand tracked text and paths
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          pattern = re.compile(r"intendhub", re.IGNORECASE)
          exemptions = {"docs/BRAND.md"}

          def replacement(match: re.Match[str]) -> str:
              value = match.group(0)
              if value.isupper():
                  return "INTENDANCY"
              if value.islower():
                  return "intendancy"
              return "Intendancy"

          raw_paths = subprocess.check_output(["git", "ls-files", "-z"])
          paths = [p.decode("utf-8") for p in raw_paths.split(b"\0") if p]
          changed: list[str] = []
          skipped_binary: list[str] = []

          for name in paths:
              if name in exemptions:
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  skipped_binary.append(name)
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  skipped_binary.append(name)
                  continue
              updated = pattern.sub(replacement, text)
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")
                  changed.append(name)

          renamed: list[tuple[str, str]] = []
          for old in sorted(paths, key=lambda value: (value.count("/"), len(value)), reverse=True):
              if not pattern.search(old):
                  continue
              new = pattern.sub(replacement, old)
              if old == new or not Path(old).exists():
                  continue
              Path(new).parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "mv", old, new], check=True)
              renamed.append((old, new))

          print(f"Updated product naming in {len(changed)} text files.")
          for name in changed:
              print(f"  text: {name}")
          for old, new in renamed:
              print(f"  path: {old} -> {new}")
          if skipped_binary:
              print(f"Skipped {len(skipped_binary)} binary or non-UTF-8 tracked files.")
          PY

          rm -- .github/workflows/rebrand-intendancy.yml

      - name: Finalize product identity and compatibility vectors
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"expected one occurrence in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8", newline="")

          # This repository has no production deployment or frozen wire format.
          # Changing the product-scoped domain separator therefore intentionally
          # establishes a new deterministic V1 deployment-context vector.
          replace_once(
              "cli/src/profile.rs",
              "0x253f2981e5d5c11df649ad0fcf6418bf61cdc0b2d902f9100466eee3dd2350aa",
              "0xb4bbf9f0eb29e58361c80fbd3d772def3fc6f73d069600ae41e3575844a2dbca",
          )

          package_path = Path("frontend/package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          if package.get("name") != "frontend":
              raise RuntimeError(f"unexpected frontend package name: {package.get('name')!r}")
          package["name"] = "intendancy-frontend"
          package["description"] = "Web interface for the Intendancy verifiable agent-skill registry."
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")

          lock_path = Path("frontend/package-lock.json")
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          if lock.get("name") != "frontend" or lock.get("packages", {}).get("", {}).get("name") != "frontend":
              raise RuntimeError("unexpected package-lock frontend identity")
          lock["name"] = "intendancy-frontend"
          lock["packages"][""]["name"] = "intendancy-frontend"
          lock_path.write_text(json.dumps(lock, indent=2) + "\n", encoding="utf-8")

          index_path = Path("frontend/index.html")
          index = index_path.read_text(encoding="utf-8")
          old_head = """    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />
              <title>frontend</title>"""
          new_head = """    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />
              <meta name=\"description\" content=\"A verifiable, policy-governed registry for agent skills.\" />
              <meta name=\"theme-color\" content=\"#4c1d95\" />
              <meta property=\"og:title\" content=\"Intendancy\" />
              <meta property=\"og:description\" content=\"A verifiable, policy-governed registry for agent skills.\" />
              <meta property=\"og:type\" content=\"website\" />
              <title>Intendancy — Verifiable Agent Skill Registry</title>"""
          if index.count(old_head) != 1:
              raise RuntimeError("unexpected frontend/index.html head scaffold")
          index_path.write_text(index.replace(old_head, new_head), encoding="utf-8", newline="")

          mark = """<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" role=\"img\" aria-labelledby=\"title\">
            <title id=\"title\">Intendancy</title>
            <rect width=\"64\" height=\"64\" rx=\"14\" fill=\"#4c1d95\"/>
            <path d=\"M18 14h28v8h-9v20h9v8H18v-8h9V22h-9z\" fill=\"#fff\"/>
            <circle cx=\"32\" cy=\"32\" r=\"4\" fill=\"#c4b5fd\"/>
          </svg>
          """
          Path("assets").mkdir(exist_ok=True)
          Path("assets/intendancy-mark.svg").write_text(mark, encoding="utf-8", newline="")
          Path("frontend/public/favicon.svg").write_text(mark, encoding="utf-8", newline="")
          Path("meta-evidence/intendancy-logo.svg").write_text(mark, encoding="utf-8", newline="")

          replace_once(
              "frontend/src/components/layout/Header.tsx",
              """          <Link to=\"/\" className=\"text-lg font-bold text-gray-900 hover:text-gray-700\">
                      Intendancy
                    </Link>""",
              """          <Link
                      to=\"/\"
                      className=\"flex items-center gap-2 text-lg font-bold text-gray-900 hover:text-gray-700\"
                    >
                      <img src=\"/favicon.svg\" alt=\"\" aria-hidden=\"true\" className=\"h-7 w-7\" />
                      <span>Intendancy</span>
                    </Link>""",
          )

          replace_once(
              "README.md",
              """# Intendancy

          **A verifiable, policy-governed registry for agent skills.**""",
              """<p align=\"center\">
            <img src=\"assets/intendancy-mark.svg\" width=\"112\" alt=\"Intendancy mark\" />
          </p>

          <h1 align=\"center\">Intendancy</h1>

          <p align=\"center\"><strong>A verifiable, policy-governed registry for agent skills.</strong></p>""",
          )
          replace_once(
              "README.md",
              "cmp docs/listing-policy.md frontend/public/listing-policy.md",
              "./scripts/check-brand.sh\ncmp docs/listing-policy.md frontend/public/listing-policy.md",
          )
          replace_once(
              "AGENTS.md",
              "- When either listing-policy copy changes: `cmp docs/listing-policy.md frontend/public/listing-policy.md`",
              "- Run `./scripts/check-brand.sh` after product-facing naming, metadata, or logo changes.\n- When either listing-policy copy changes: `cmp docs/listing-policy.md frontend/public/listing-policy.md`",
          )

          brand_check = """#!/usr/bin/env bash
          set -euo pipefail

          root=$(git rev-parse --show-toplevel)
          cd \"$root\"

          legacy_pattern='intend[h]ub'
          if git grep -Iin -E \"$legacy_pattern\" -- ':!docs/BRAND.md'; then
            echo 'Deprecated product name remains outside docs/BRAND.md.' >&2
            exit 1
          fi
          if git ls-files | grep -i -E \"$legacy_pattern\"; then
            echo 'A tracked path still contains the deprecated product name.' >&2
            exit 1
          fi

          grep -Fq '\"name\": \"intendancy-frontend\"' frontend/package.json
          grep -Fq '<title>Intendancy — Verifiable Agent Skill Registry</title>' frontend/index.html
          grep -Fq 'Intendancy' frontend/src/components/layout/Header.tsx
          cmp docs/listing-policy.md frontend/public/listing-policy.md
          cmp assets/intendancy-mark.svg frontend/public/favicon.svg
          cmp assets/intendancy-mark.svg meta-evidence/intendancy-logo.svg
          git diff --check
          """
          check_path = Path("scripts/check-brand.sh")
          check_path.write_text(brand_check, encoding="utf-8", newline="")
          os.chmod(check_path, 0o755)
          PY

      - name: Verify naming invariants
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-brand.sh

      - name: Validate contracts
        shell: bash
        run: |
          set -euo pipefail
          cd contracts
          forge fmt
          forge fmt --check
          forge test

      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run lint
          npm run build

      - name: Validate intend CLI
        shell: bash
        run: |
          set -euo pipefail
          cd cli
          cargo clippy --fix --all-targets --locked --allow-dirty --allow-staged -- -D warnings
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Validate Gnosis anchor spike
        shell: bash
        run: |
          set -euo pipefail
          cd spikes/gnosis-anchor
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Validate snapshot benchmark spike
        shell: bash
        run: |
          set -euo pipefail
          cd spikes/snapshot-bench
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked

      - name: Commit the completed rebrand
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/check-brand.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: rebrand Intendhub as Intendancy'
          git push origin HEAD:chore/rebrand-intendancy
